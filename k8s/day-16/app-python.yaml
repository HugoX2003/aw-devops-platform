apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: py-hello
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HugoX2003/aw-devops-platform.git
    targetRevision: main
    path: k8s/day-16
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true