name: CI
on: [push]

jobs:
  ci-infra-and-verify-artifacts-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Credenciales base SOLO para ejecutar Terraform
      - name: Configure AWS credentials (base)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 2) Crear la infra (bucket + role + policy)
      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform apply -auto-approve
        working-directory: infra/terraform

      # 3) Leer outputs: bucket artifacts + role ARN
      - name: Read Terraform outputs
        id: tfout
        run: |
          echo "ARTIFACTS_BUCKET=$(terraform output -raw artifacts_bucket_name)" >> $GITHUB_OUTPUT
          echo "CI_ROLE_ARN=$(terraform output -raw ci_role_arn)" >> $GITHUB_OUTPUT
        working-directory: infra/terraform

      # 4) Asumir el rol creado
      - name: Configure AWS credentials (assume created CI role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          role-to-assume: ${{ steps.tfout.outputs.CI_ROLE_ARN }}
          role-session-name: aw-bootcamp-ci-session
          role-skip-session-tagging: true

      # 5) Subir artifact al bucket usando el rol asumido
      - name: Upload artifact to S3
        run: |
          echo "artifact generated by CI - ${GITHUB_SHA}" > artifact.txt
          aws s3 cp artifact.txt s3://${{ steps.tfout.outputs.ARTIFACTS_BUCKET }}/artifacts/artifact-${GITHUB_SHA}.txt