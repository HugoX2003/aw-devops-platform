name: CI
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build and Push (ECR)
        run: |
          docker build -t aw-sample:latest ./app
          docker tag aw-sample:latest 711387135481.dkr.ecr.us-east-1.amazonaws.com/aw-sample:latest
          docker push 711387135481.dkr.ecr.us-east-1.amazonaws.com/aw-sample:latest

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        id: tf
        run: |
          terraform init
          terraform apply -auto-approve
        working-directory: infra/terraform

      - name: Sync S3 and Invalidate CloudFront
        run: |
          BUCKET=$(terraform output -raw s3_bucket_name)
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          
          aws s3 cp ../../index.html s3://$BUCKET/index.html
          
          echo "Iniciando invalidación para $DIST_ID..."
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
        working-directory: infra/terraform