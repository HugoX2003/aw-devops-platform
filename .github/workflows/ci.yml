name: CI
on: [push]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        id: tf
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform init
          terraform apply -auto-approve
        working-directory: infra/terraform

      - name: Sync S3 and Invalidate CloudFront
        run: |
          # 1. Obtenemos los nombres dinámicos de los outputs
          BUCKET=$(terraform output -raw s3_bucket_name)
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          
          # 2. Subimos el index.html (está en la raíz del proyecto)
          aws s3 cp ../../index.html s3://$BUCKET/index.html
          
          # 3. EL RETO: Invalidación automática después del deploy
          echo "Iniciando invalidación automática para la distribución: $DIST_ID"
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
        working-directory: infra/terraform